name: Greenhouse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Greenhouse:
    type: application
    platform: iOS
    sources:
      - path: Greenhouse
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).greenhouse
        ASSETCATALOG_COMPILER_APPICON_NAME: ""  # app icon arrives in the polish phase
    info:
      path: Greenhouse/Resources/Info.plist
      properties:
        CFBundleDisplayName: Greenhouse
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Greenhouse/Resources/Greenhouse.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - $(CLOUDKIT_CONTAINER)
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
  GreenhouseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GreenhouseTests
    dependencies:
      - target: Greenhouse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).greenhouse.tests
schemes:
  Greenhouse:
    build:
      targets:
        Greenhouse: all
        GreenhouseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GreenhouseTests
